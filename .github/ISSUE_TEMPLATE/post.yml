name: نیا مضمون
description: مطالعہ کے لیے نیا مضمون تیار کریں
title: "[مضمون] "
labels:
  - publish
body:
  - type: dropdown
    id: category
    attributes:
      label: "📂 کٹیگری منتخب کریں"
      description: "مضمون شائع کرنے سے پہلے اس کی مناسب کٹیگری منتخب کریں۔"
      options:
        - "عقیدۂ توحید"
        - "تاریخِ اسلام"
        - "مشاجراتِ صحابہ"
        - "فرق و مذاہب"
        - "حدیث و آثار"
        - "کتبِ اسلامیہ"
        - "سیرت النبی ﷺ"
        - "سیرتِ صحابہ و تابعین"
        - "حالاتِ حاضرہ"
    validations:
      required: true

  - type: dropdown
    id: alignment
    attributes:
      label: "🎨 متن کی ترتیب"
      description: "مضمون کے متن کی ترتیب منتخب کریں۔"
      options:
        - "جسٹیفائی"
        - "دائیں"
        - "بائیں"
        - "درمیان"
    validations:
      required: true

  - type: input
    id: subject
    attributes:
      label: "📝 مضمون کا عنوان"
      description: "مضمون کا عنوان یہاں لکھیں۔"
      placeholder: "مثال: توحید کی اہمیت اور فضیلت"
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: "📄 مضمون"
      description: "یہاں مکمل مضمون لکھیں۔ تصویر شامل کرنے کے لیے اس کا URL Markdown میں درج کریں، مثلاً ![تصویر](IMAGE_URL)۔"
      placeholder: "مکمل مضمون یہاں لکھیں..."
    validations:
      required: true

  - type: textarea
    id: images
    attributes:
      label: "🖼️ تصاویر شامل کریں"
      description: "ہر تصویر کا براہِ راست URL الگ سطر میں لکھیں۔ اگر تصویر مضمون کے اندر مخصوص جگہ پر چاہیے تو مضمون میں ![تصویر](URL) لکھیں۔"
      placeholder: "https://example.com/image.jpg"
    validations:
      required: false

  - type: textarea
    id: videos
    attributes:
      label: "🎥 ویڈیوز شامل کریں"
      description: "YouTube ویڈیو کا URL الگ سطر میں لکھیں۔ ویڈیو مضمون کے آخر میں خودکار طور پر شامل ہوگی۔"
      placeholder: "https://www.youtube.com/watch?v=XXXXXXXXXXX"
    validations:
      required: false
