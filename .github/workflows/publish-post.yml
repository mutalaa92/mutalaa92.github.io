name: Publish Article

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'publish')
    runs-on: ubuntu-latest

    steps:
      - name: Publish submitted article
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            function field(name) {
              const re = new RegExp(`### ${name}\\s*\\n([\\s\\S]*?)(?=\\n### |$)`);
              const m = body.match(re);
              return m ? m[1].trim() : '';
            }

            const categoryName = field('📂 کٹیگری منتخب کریں') || field('موضوع');
            const content = field('📄 مضمون') || field('مضمون');
            const formTitle = field('📝 مضمون کا عنوان');
            const title = formTitle || issue.title.replace(/^\\[مضمون\\]\\s*/i, '').trim() || 'بلا عنوان';

            const categoryMap = {
              'عقیدۂ توحید': 'tawheed',
              'تاریخِ اسلام': 'history',
              'مشاجراتِ صحابہ': 'sahaba',
              'فرق و مذاہب': 'sects',
              'حدیث و آثار': 'hadith',
              'کتبِ اسلامیہ': 'books',
              'سیرت النبی ﷺ': 'seerah',
              'سیرتِ صحابہ و تابعین': 'scholars',
              'حالاتِ حاضرہ': 'current'
            };

            const category = categoryMap[categoryName];
            if (!category || !content) {
              core.setFailed('کٹیگری یا مضمون کا متن موجود نہیں۔');
              return;
            }

            const now = new Date();
            const date = now.toISOString().slice(0, 10);
            const time = now.toISOString();
            const slug = title
              .toLowerCase()
              .replace(/[^\\p{L}\\p{N}]+/gu, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 70) || `post-${issue.number}`;
            const filename = `${date}-${slug}-${issue.number}.md`;
            const path = `_posts/${filename}`;

            const markdown = `---\ntitle: "${title.replace(/"/g, '\\"')}"\ncategory: "${categoryName.replace(/"/g, '\\"')}"\ncategory_key: "${category}"\ndate: "${time}"\n---\n\n${content}\n`;

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `Publish article: ${title}`,
              content: Buffer.from(markdown, 'utf8').toString('base64')
            });

            let posts = [];
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'data/posts.json'
              });
              posts = JSON.parse(Buffer.from(existing.data.content, 'base64').toString('utf8'));
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            posts = posts.filter(p => p.file !== filename);
            posts.unshift({
              file: filename,
              title,
              category: categoryName,
              categoryKey: category,
              date: time,
              issue: issue.number
            });
            posts.sort((a, b) => new Date(b.date) - new Date(a.date));

            let dataSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'data/posts.json'
              });
              dataSha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const dataArgs = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'data/posts.json',
              message: `Update article index: ${title}`,
              content: Buffer.from(JSON.stringify(posts, null, 2) + '\\n', 'utf8').toString('base64')
            };
            if (dataSha) dataArgs.sha = dataSha;
            await github.rest.repos.createOrUpdateFileContents(dataArgs);

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `✅ مضمون کامیابی سے شائع کر دیا گیا۔\n\nکٹیگری: **${categoryName}**\n\nفائل: \\`_posts/${filename}\\``
            });
