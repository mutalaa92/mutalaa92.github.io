name: Publish Article

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            function field(name) {
              const marker = '### ' + name;
              const start = body.indexOf(marker);
              if (start < 0) return '';
              const rest = body.slice(start + marker.length).replace(/^\s*\n/, '');
              const end = rest.indexOf('\n### ');
              return (end < 0 ? rest : rest.slice(0, end)).trim();
            }
            const categoryName = field('📂 کٹیگری منتخب کریں');
            const alignmentName = field('🎨 متن کی ترتیب') || 'جسٹیفائی';
            const content = field('📄 مضمون');
            const formTitle = field('📝 مضمون کا عنوان');
            const images = field('🖼️ تصاویر شامل کریں');
            const videos = field('🎥 ویڈیوز شامل کریں');
            const categoryMap = {'عقیدۂ توحید':'tawheed','تاریخِ اسلام':'history','مشاجراتِ صحابہ':'sahaba','فرق و مذاهب':'sects','حدیث و آثار':'hadith','کتبِ اسلامیہ':'books','سیرت النبی ﷺ':'seerah','سیرتِ صحابہ و تابعین':'scholars','حالاتِ حاضرہ':'current'};
            const alignmentMap = {'جسٹیفائی':'justify','دائیں':'right','بائیں':'left','درمیان':'center'};
            const category = categoryMap[categoryName];
            const alignment = alignmentMap[alignmentName] || 'justify';
            if (!category || !content || !formTitle) throw new Error('کٹیگری، عنوان یا مضمون کا متن نہیں ملا۔');
            let media = '';
            images.split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>{ if(x.startsWith('http://')||x.startsWith('https://')) media += '\n\n![تصویر](' + x + ')'; });
            videos.split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>{ try { const u=new URL(x); let id=''; if(u.hostname.includes('youtu.be')) id=u.pathname.slice(1); else if(u.pathname.startsWith('/shorts/')) id=u.pathname.split('/')[2]||''; else id=u.searchParams.get('v')||''; if(id) media += '\n\n<div class="video-embed"><iframe src="https://www.youtube.com/embed/' + id + '" title="YouTube video" frameborder="0" allowfullscreen></iframe></div>'; } catch(e) {} });
            const now = new Date().toISOString();
            const date = now.slice(0,10);
            const filename = date + '-article-' + issue.number + '.md';
            const markdown = '---\ntitle: "' + formTitle.split('"').join('\\"') + '"\ncategory: "' + categoryName.split('"').join('\\"') + '"\ncategory_key: "' + category + '"\nalignment: "' + alignment + '"\ndate: "' + now + '"\n---\n\n' + content + media + '\n';
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path:'_posts/'+filename,message:'Publish article: '+formTitle,content:Buffer.from(markdown,'utf8').toString('base64')});
            let posts=[]; let sha=null;
            try { const x=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:'data/posts.json'}); posts=JSON.parse(Buffer.from(x.data.content,'base64').toString('utf8')); sha=x.data.sha; } catch(e) { if(e.status!==404) throw e; }
            posts=posts.filter(p=>p.issue!==issue.number);
            posts.unshift({file:filename,title:formTitle,category:categoryName,categoryKey:category,alignment,date:now,issue:issue.number});
            posts.sort((a,b)=>new Date(b.date)-new Date(a.date));
            const args={owner:context.repo.owner,repo:context.repo.repo,path:'data/posts.json',message:'Update article index: '+formTitle,content:Buffer.from(JSON.stringify(posts,null,2)+'\n','utf8').toString('base64')};
            if(sha) args.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(args);
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,state:'closed',state_reason:'completed',labels:['Published']});
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,body:'✅ مضمون شائع ہو گیا۔ فائل: `_posts/'+filename+'`'});
