name: Publish Article

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue=context.payload.issue;
            const body=issue.body||'';
            const field=n=>{const m='### '+n;const a=body.indexOf(m);if(a<0)return '';const s=body.slice(a+m.length).trim();const b=s.indexOf('\n### ');return (b<0?s:s.slice(0,b)).trim();};
            const categoryName=field('📂 کٹیگری منتخب کریں');
            const alignmentName=field('🎨 متن کی ترتیب')||'جسٹیفائی';
            const content=field('📄 مضمون');
            const title=field('📝 مضمون کا عنوان')||'بلا عنوان';
            const images=field('🖼️ تصاویر شامل کریں');
            const videos=field('🎥 ویڈیوز شامل کریں');
            const map={'عقیدۂ توحید':'tawheed','تاریخِ اسلام':'history','مشاجراتِ صحابہ':'sahaba','فرق و مذاهب':'sects','حدیث و آثار':'hadith','کتبِ اسلامیہ':'books','سیرت النبی ﷺ':'seerah','سیرتِ صحابہ و تابعین':'scholars','حالاتِ حاضرہ':'current'};
            const amap={'جسٹیفائی':'justify','دائیں':'right','بائیں':'left','درمیان':'center'};
            if(!map[categoryName]||!content)throw new Error('کٹیگری یا مضمون کا متن نہیں ملا۔');
            let media='';
            images.split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(x.startsWith('http'))media+='\n\n![تصویر]('+x+')';});
            videos.split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>{try{const u=new URL(x);let id=u.searchParams.get('v')||'';if(!id&&u.hostname.includes('youtu.be'))id=u.pathname.slice(1);if(!id&&u.pathname.startsWith('/shorts/'))id=u.pathname.split('/')[2]||'';if(id)media+='\n\n<div class="video-embed"><iframe src="https://www.youtube.com/embed/'+id+'" title="YouTube video" frameborder="0" allowfullscreen></iframe></div>';}catch(e){}});
            const now=new Date().toISOString();
            const filename=now.slice(0,10)+'-article-'+issue.number+'.md';
            const markdown='---\ntitle: "'+title.split('"').join('\\"')+'"\ncategory: "'+categoryName.split('"').join('\\"')+'"\ncategory_key: "'+map[categoryName]+'"\nalignment: "'+(amap[alignmentName]||'justify')+'"\ndate: "'+now+'"\n---\n\n'+content+media+'\n';
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path:'_posts/'+filename,message:'Publish article: '+title,content:Buffer.from(markdown,'utf8').toString('base64')});
            let posts=[];let sha=null;try{const x=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:'data/posts.json'});posts=JSON.parse(Buffer.from(x.data.content,'base64').toString('utf8'));sha=x.data.sha;}catch(e){if(e.status!==404)throw e;}
            posts=posts.filter(p=>p.issue!==issue.number);posts.unshift({file:filename,title,category:categoryName,categoryKey:map[categoryName],alignment:amap[alignmentName]||'justify',date:now,issue:issue.number});
            const args={owner:context.repo.owner,repo:context.repo.repo,path:'data/posts.json',message:'Update article index: '+title,content:Buffer.from(JSON.stringify(posts,null,2)+'\n','utf8').toString('base64')};if(sha)args.sha=sha;await github.rest.repos.createOrUpdateFileContents(args);
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,state:'closed',state_reason:'completed',labels:['Published']});
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,body:'✅ مضمون شائع ہو گیا۔ فائل: `_posts/'+filename+'`'});
