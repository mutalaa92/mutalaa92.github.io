name: Publish Article

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'publish')
    runs-on: ubuntu-latest

    steps:
      - name: Publish submitted article
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            function field(name) {
              const re = new RegExp(`### ${name}\\s*\\n([\\s\\S]*?)(?=\\n### |$)`);
              const m = body.match(re);
              return m ? m[1].trim() : '';
            }

            const categoryName = field('📂 کٹیگری منتخب کریں') || field('موضوع');
            const alignmentName = field('🎨 متن کی ترتیب') || 'جسٹیفائی';
            const content = field('📄 مضمون') || field('مضمون');
            const formTitle = field('📝 مضمون کا عنوان');
            const imageUrls = field('🖼️ تصاویر شامل کریں');
            const videoUrls = field('🎥 ویڈیوز شامل کریں');
            const title = formTitle || issue.title.replace(/^\\[مضمون\\]\\s*/i, '').trim() || 'بلا عنوان';

            const categoryMap = {
              'عقیدۂ توحید': 'tawheed',
              'تاریخِ اسلام': 'history',
              'مشاجراتِ صحابہ': 'sahaba',
              'فرق و مذاهب': 'sects',
              'حدیث و آثار': 'hadith',
              'کتبِ اسلامیہ': 'books',
              'سیرت النبی ﷺ': 'seerah',
              'سیرتِ صحابہ و تابعین': 'scholars',
              'حالاتِ حاضرہ': 'current'
            };

            const alignmentMap = {
              'جسٹیفائی': 'justify',
              'دائیں': 'right',
              'بائیں': 'left',
              'درمیان': 'center'
            };

            const category = categoryMap[categoryName];
            const alignment = alignmentMap[alignmentName] || 'justify';

            if (!category || !content) {
              core.setFailed('کٹیگری یا مضمون کا متن موجود نہیں۔');
              return;
            }

            const isImage = url => /^https?:\\/\\/.+\\.(?:jpg|jpeg|png|gif|webp|avif)(?:[?#].*)?$/i.test(url);
            const imageList = imageUrls
              .split(/\\r?\\n/)
              .map(s => s.trim())
              .filter(Boolean)
              .filter(isImage);

            const videoList = videoUrls
              .split(/\\r?\\n/)
              .map(s => s.trim())
              .filter(Boolean)
              .filter(s => /^https?:\\/\\/(?:www\\.)?(?:youtube\\.com\\/(?:watch\\?v=|shorts\\/)|youtu\\.be\\/)/i.test(s));

            let media = '';

            if (imageList.length) {
              media += '\\n\\n## تصاویر\\n\\n' + imageList.map((url, i) => `![تصویر ${i + 1}](${url})`).join('\\n\\n');
            }

            if (videoList.length) {
              const embeds = videoList.map(url => {
                let id = '';
                try {
                  const u = new URL(url);
                  if (u.hostname.includes('youtu.be')) id = u.pathname.slice(1);
                  else if (u.pathname.startsWith('/shorts/')) id = u.pathname.split('/')[2];
                  else id = u.searchParams.get('v') || '';
                } catch (_) {}
                return id ? `<div class="video-embed"><iframe src="https://www.youtube.com/embed/${id}" title="YouTube video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>` : '';
              }).filter(Boolean);
              if (embeds.length) media += '\\n\\n## ویڈیوز\\n\\n' + embeds.join('\\n\\n');
            }

            const now = new Date();
            const time = now.toISOString();
            const date = time.slice(0, 10);
            const slug = title
              .toLowerCase()
              .replace(/[^\\p{L}\\p{N}]+/gu, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 70) || `post-${issue.number}`;
            const filename = `${date}-${slug}-${issue.number}.md`;
            const path = `_posts/${filename}`;

            const markdown = `---\\ntitle: "${title.replace(/"/g, '\\\"')}"\\ncategory: "${categoryName.replace(/"/g, '\\\"')}"\\ncategory_key: "${category}"\\nalignment: "${alignment}"\\ndate: "${time}"\\n---\\n\\n${content}${media}\\n`;

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `Publish article: ${title}`,
              content: Buffer.from(markdown, 'utf8').toString('base64')
            });

            let posts = [];
            let dataSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'data/posts.json'
              });
              posts = JSON.parse(Buffer.from(existing.data.content, 'base64').toString('utf8'));
              dataSha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            posts = posts.filter(p => p.file !== filename);
            posts.unshift({
              file: filename,
              title,
              category: categoryName,
              categoryKey: category,
              alignment,
              date: time,
              issue: issue.number
            });
            posts.sort((a, b) => new Date(b.date) - new Date(a.date));

            const dataArgs = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'data/posts.json',
              message: `Update article index: ${title}`,
              content: Buffer.from(JSON.stringify(posts, null, 2) + '\\n', 'utf8').toString('base64')
            };
            if (dataSha) dataArgs.sha = dataSha;
            await github.rest.repos.createOrUpdateFileContents(dataArgs);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `✅ مضمون کامیابی سے شائع کر دیا گیا۔\\n\\nکٹیگری: **${categoryName}**\\n\\nترتیب: **${alignmentName}**\\n\\nفائل: \\`_posts/${filename}\\``
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'completed',
              labels: ['Published']
            });
