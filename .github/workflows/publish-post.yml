name: Publish Article

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const get = (label) => {
              const marker = '### ' + label;
              const start = body.indexOf(marker);
              if (start < 0) return '';
              const rest = body.slice(start + marker.length);
              const end = rest.indexOf('\n### ');
              return (end < 0 ? rest : rest.slice(0, end)).trim();
            };
            const categoryName = get('📂 کٹیگری منتخب کریں');
            const alignmentName = get('🎨 متن کی ترتیب') || 'جسٹیفائی';
            const title = get('📝 مضمون کا عنوان');
            const content = get('📄 مضمون');
            const images = get('🖼️ تصاویر شامل کریں');
            const videos = get('🎥 ویڈیوز شامل کریں');
            const categories = {'عقیدۂ توحید':'tawheed','تاریخِ اسلام':'history','مشاجراتِ صحابہ':'sahaba','فرق و مذاهب':'sects','حدیث و آثار':'hadith','کتبِ اسلامیہ':'books','سیرت النبی ﷺ':'seerah','سیرتِ صحابہ و تابعین':'scholars','حالاتِ حاضرہ':'current'};
            const aligns = {'جسٹیفائی':'justify','دائیں':'right','بائیں':'left','درمیان':'center'};
            if (!title || !content || !categories[categoryName]) throw new Error('کٹیگری، عنوان یا مضمون موجود نہیں۔');
            const now = new Date().toISOString();
            const filename = now.slice(0,10) + '-article-' + issue.number + '.md';
            let media = '';
            for (const url of images.split('\n').map(x=>x.trim()).filter(Boolean)) if (url.startsWith('http://') || url.startsWith('https://')) media += '\n\n![تصویر](' + url + ')';
            for (const url of videos.split('\n').map(x=>x.trim()).filter(Boolean)) { try { const u = new URL(url); let id = u.searchParams.get('v') || ''; if (!id && u.hostname.includes('youtu.be')) id = u.pathname.slice(1); if (!id && u.pathname.startsWith('/shorts/')) id = u.pathname.split('/')[2] || ''; if (id) media += '\n\n<div class="video-embed"><iframe src="https://www.youtube.com/embed/' + id + '" title="YouTube video" frameborder="0" allowfullscreen></iframe></div>'; } catch(e) {} }
            const markdown = '---\ntitle: "' + title.replaceAll('"','\\"') + '"\ncategory: "' + categoryName.replaceAll('"','\\"') + '"\ncategory_key: "' + categories[categoryName] + '"\nalignment: "' + (aligns[alignmentName] || 'justify') + '"\ndate: "' + now + '"\n---\n\n' + content + media + '\n';
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path:'_posts/'+filename,message:'Publish article: '+title,content:Buffer.from(markdown,'utf8').toString('base64')});
            let posts=[]; let sha=null;
            try { const x=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:'data/posts.json'}); posts=JSON.parse(Buffer.from(x.data.content,'base64').toString('utf8')); sha=x.data.sha; } catch(e) { if(e.status!==404) throw e; }
            posts=posts.filter(p=>p.issue!==issue.number); posts.unshift({file:filename,title,category:categoryName,categoryKey:categories[categoryName],alignment:aligns[alignmentName]||'justify',date:now,issue:issue.number});
            const args={owner:context.repo.owner,repo:context.repo.repo,path:'data/posts.json',message:'Update article index: '+title,content:Buffer.from(JSON.stringify(posts,null,2)+'\n','utf8').toString('base64')}; if(sha) args.sha=sha; await github.rest.repos.createOrUpdateFileContents(args);
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,state:'closed',state_reason:'completed',labels:['Published']});
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,body:'✅ مضمون کامیابی سے شائع ہوگیا۔ فائل: `_posts/'+filename+'`'});
