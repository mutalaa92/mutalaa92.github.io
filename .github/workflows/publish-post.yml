name: Publish Article

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'publish')
    runs-on: ubuntu-latest
    steps:
      - name: Publish submitted article
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            function field(name) {
              const marker = '### ' + name;
              const start = body.indexOf(marker);
              if (start < 0) return '';
              const from = body.slice(start + marker.length).replace(/^\s*\n/, '');
              const end = from.indexOf('\n### ');
              return (end < 0 ? from : from.slice(0, end)).trim();
            }
            const categoryName = field('📂 کٹیگری منتخب کریں');
            const alignmentName = field('🎨 متن کی ترتیب') || 'جسٹیفائی';
            const content = field('📄 مضمون');
            const formTitle = field('📝 مضمون کا عنوان');
            const imageUrls = field('🖼️ تصاویر شامل کریں');
            const videoUrls = field('🎥 ویڈیوز شامل کریں');
            const title = formTitle || issue.title.replace('[مضمون]', '').trim() || 'بلا عنوان';
            const categoryMap = {'عقیدۂ توحید':'tawheed','تاریخِ اسلام':'history','مشاجراتِ صحابہ':'sahaba','فرق و مذاهب':'sects','حدیث و آثار':'hadith','کتبِ اسلامیہ':'books','سیرت النبی ﷺ':'seerah','سیرتِ صحابہ و تابعین':'scholars','حالاتِ حاضرہ':'current'};
            const alignmentMap = {'جسٹیفائی':'justify','دائیں':'right','بائیں':'left','درمیان':'center'};
            const category = categoryMap[categoryName];
            const alignment = alignmentMap[alignmentName] || 'justify';
            if (!category || !content) { core.setFailed('کٹیگری یا مضمون کا متن نہیں ملا۔'); return; }
            let media = '';
            for (const url of imageUrls.split('\n').map(s=>s.trim()).filter(Boolean)) { if (url.startsWith('http://') || url.startsWith('https://')) media += '\n\n![تصویر](' + url + ')'; }
            for (const url of videoUrls.split('\n').map(s=>s.trim()).filter(Boolean)) {
              let id=''; try { const u=new URL(url); if(u.hostname.includes('youtu.be')) id=u.pathname.slice(1); else if(u.pathname.startsWith('/shorts/')) id=u.pathname.split('/')[2]||''; else id=u.searchParams.get('v')||''; } catch(e) {}
              if(id) media += '\n\n<div class="video-embed"><iframe src="https://www.youtube.com/embed/' + id + '" title="YouTube video" frameborder="0" allowfullscreen></iframe></div>';
            }
            const time = new Date().toISOString();
            const date = time.slice(0,10);
            const slug = (title.toLowerCase().split(' ').join('-') || ('post-' + issue.number)).slice(0,70);
            const filename = date + '-' + slug + '-' + issue.number + '.md';
            const path = '_posts/' + filename;
            const markdown = '---\ntitle: "' + title.split('"').join('\\"') + '"\ncategory: "' + categoryName.split('"').join('\\"') + '"\ncategory_key: "' + category + '"\nalignment: "' + alignment + '"\ndate: "' + time + '"\n---\n\n' + content + media + '\n';
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,message:'Publish article: '+title,content:Buffer.from(markdown,'utf8').toString('base64')});
            let posts=[]; let dataSha=null;
            try { const existing=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:'data/posts.json'}); posts=JSON.parse(Buffer.from(existing.data.content,'base64').toString('utf8')); dataSha=existing.data.sha; } catch(e) { if(e.status!==404) throw e; }
            posts=posts.filter(p=>p.issue!==issue.number && p.file!==filename);
            posts.unshift({file:filename,title,category:categoryName,categoryKey:category,alignment,date:time,issue:issue.number});
            posts.sort((a,b)=>new Date(b.date)-new Date(a.date));
            const dataArgs={owner:context.repo.owner,repo:context.repo.repo,path:'data/posts.json',message:'Update article index: '+title,content:Buffer.from(JSON.stringify(posts,null,2)+'\n','utf8').toString('base64')};
            if(dataSha) dataArgs.sha=dataSha;
            await github.rest.repos.createOrUpdateFileContents(dataArgs);
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,state:'closed',state_reason:'completed',labels:['Published']});
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,body:'✅ مضمون کامیابی سے شائع کر دیا گیا۔\n\nکٹیگری: **'+categoryName+'**\n\nترتیب: **'+alignmentName+'**\n\nفائل: `_posts/'+filename+'`'});
