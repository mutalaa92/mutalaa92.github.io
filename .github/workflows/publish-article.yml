name: Publish Article

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.user.login == 'mutalaa92' && startsWith(github.event.issue.title, '[مضمون]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create article
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import os, re
          from datetime import datetime

          title = os.environ.get('ISSUE_TITLE', '').replace('[مضمون]', '').strip()
          body = os.environ.get('ISSUE_BODY', '')
          number = os.environ['ISSUE_NUMBER']

          category_match = re.search(r'### موضوع\s*\n\s*([^\n]+)', body)
          category = category_match.group(1).strip() if category_match else 'حالاتِ حاضرہ'

          content_match = re.search(r'### مضمون\s*\n\s*([\s\S]*)', body)
          content = content_match.group(1).strip() if content_match else body.strip()
          content = re.sub(r'<!--.*?-->', '', content, flags=re.S).strip()

          now = datetime.now()
          date = now.strftime('%Y-%m-%d')
          timestamp = now.strftime('%Y-%m-%d %H:%M:%S')
          path = f'_posts/{date}-article-{number}.md'

          def yaml_escape(value):
              return value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', ' ')

          os.makedirs('_posts', exist_ok=True)
          with open(path, 'w', encoding='utf-8') as f:
              f.write('---\n')
              f.write(f'title: "{yaml_escape(title)}"\n')
              f.write(f'category: "{yaml_escape(category)}"\n')
              f.write(f'date: "{timestamp}"\n')
              f.write('featured: false\n')
              f.write('---\n\n')
              f.write(content + '\n')
          PY

      - name: Commit article
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _posts/
          git commit -m "Publish article from issue #${{ github.event.issue.number }}"
          git push

      - name: Close request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment 'مضمون کامیابی سے شائع کر دیا گیا ہے۔ GitHub Pages پر ظاہر ہونے میں چند لمحے لگ سکتے ہیں۔'
