
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مضمون — مطالعہ</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f7f5;
    color: #222;
    font-family: "Noto Nastaliq Urdu", "Noto Sans Arabic", Tahoma, sans-serif;
    line-height: 2.2;
}

header {
    background: #173f35;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 900px;
    margin: 35px auto;
    padding: 0 18px;
}

.article {
    background: white;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.article h1 {
    color: #173f35;
    line-height: 1.8;
    margin-top: 0;
}

.meta {
    color: #777;
    font-size: 14px;
    margin-bottom: 25px;
}

.article img {
    max-width: 100%;
    border-radius: 12px;
    margin: 15px 0;
}

.article p {
    text-align: justify;
    margin: 18px 0;
}

.article h2,
.article h3 {
    color: #173f35;
    margin-top: 30px;
}

.article blockquote {
    border-right: 4px solid #173f35;
    padding: 10px 18px;
    margin: 20px 0;
    background: #f3f5f3;
}

.back {
    display: inline-block;
    margin-top: 25px;
    background: #173f35;
    color: white;
    padding: 8px 18px;
    border-radius: 8px;
    text-decoration: none;
}

.error {
    text-align: center;
    color: #a33;
}
</style>
</head>

<body>

<header>
    <h1><a href="index.html">مطالعہ</a></h1>
    <div>علم، تحقیق اور اسلامی آثار</div>
</header>

<div class="container">

    <article class="article" id="article">
        <p>مضمون لوڈ ہو رہا ہے...</p>
    </article>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
const REPO = "mutalaa92/mutalaa92.github.io";

function getSlug() {
    const params = new URLSearchParams(window.location.search);
    return params.get("slug");
}

function parseFrontMatter(text) {

    const match = text.match(/^---\s*([\s\S]*?)\s*---\s*([\s\S]*)$/);

    if (!match) {
        return {
            data: {},
            body: text
        };
    }

    const front = match[1];
    const body = match[2];

    const data = {};

    front.split("\n").forEach(line => {

        const index = line.indexOf(":");

        if (index === -1) return;

        const key = line.substring(0, index).trim();
        let value = line.substring(index + 1).trim();

        value = value.replace(/^["']|["']$/g, "");

        data[key] = value;
    });

    return {
        data,
        body
    };
}

function slugify(text) {

    return text
        .toLowerCase()
        .replace(/\.md$/, "")
        .replace(/^\d{4}-\d{2}-\d{2}-/, "")
        .replace(/[^\w\u0600-\u06ff\s-]/g, "")
        .trim()
        .replace(/\s+/g, "-");
}

async function loadArticle() {

    const slug = getSlug();
    const articleBox = document.getElementById("article");

    if (!slug) {
        articleBox.innerHTML = `
            <div class="error">
                <h2>مضمون دستیاب نہیں</h2>
                <p>مضمون کا لنک درست نہیں ہے۔</p>
            </div>
        `;
        return;
    }

    try {

        const response = await fetch(
            `https://api.github.com/repos/${REPO}/contents/_posts`
        );

        if (!response.ok) {
            throw new Error("Posts directory not found");
        }

        const files = await response.json();

        const file = files.find(item => slugify(item.name) === slug);

        if (!file) {
            throw new Error("Article not found");
        }

        const rawUrl =
            `https://raw.githubusercontent.com/${REPO}/main/_posts/${encodeURIComponent(file.name)}`;

        const markdownResponse = await fetch(rawUrl);

        const markdown = await markdownResponse.text();

        const parsed = parseFrontMatter(markdown);

        const title = parsed.data.title || "بغیر عنوان مضمون";
        const category = parsed.data.category || "";
        const date = parsed.data.date || "";
        const image = parsed.data.image || "";

        document.title = title + " — مطالعہ";

        let imageHTML = "";

        if (image) {
            imageHTML = `
                <img src="${image}" alt="${title}">
            `;
        }

        articleBox.innerHTML = `

            <h1>${title}</h1>

            <div class="meta">
                ${category ? "موضوع: " + category : ""}
                ${date ? " | تاریخ: " + date : ""}
            </div>

            ${imageHTML}

            <div class="content">
                ${marked.parse(parsed.body)}
            </div>

            <a class="back" href="category.html">
                ← مضامین کی طرف واپس
            </a>
        `;

    } catch (error) {

        console.error(error);

        articleBox.innerHTML = `
            <div class="error">
                <h2>مضمون نہیں ملا</h2>
                <p>ممکن ہے مضمون ابھی شائع نہ ہوا ہو۔</p>
            </div>
        `;
    }
}

loadArticle();
</script>

</body>
</html>
