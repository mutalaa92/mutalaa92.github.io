
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موضوع — مطالعہ</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f7f5;
    color: #222;
    font-family: "Noto Nastaliq Urdu", "Noto Sans Arabic", Tahoma, sans-serif;
    line-height: 2;
}

header {
    background: #173f35;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
}

header a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 1000px;
    margin: 35px auto;
    padding: 0 18px;
}

.category-title {
    text-align: center;
    color: #173f35;
    margin-bottom: 30px;
}

.posts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 20px;
}

.post {
    background: white;
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.post h2 {
    margin-top: 0;
    color: #173f35;
    font-size: 22px;
    line-height: 1.8;
}

.post h2 a {
    color: #173f35;
    text-decoration: none;
}

.meta {
    color: #777;
    font-size: 13px;
}

.read {
    display: inline-block;
    margin-top: 10px;
    background: #173f35;
    color: white;
    padding: 6px 15px;
    border-radius: 7px;
    text-decoration: none;
}

.empty {
    text-align: center;
    padding: 40px;
}

</style>

</head>

<body>

<header>

    <h1>
        <a href="index.html">مطالعہ</a>
    </h1>

    <div>
        علم، تحقیق اور اسلامی آثار
    </div>

</header>

<div class="container">

    <h1 class="category-title" id="categoryTitle">
        مضامین
    </h1>

    <div class="posts" id="posts">
        <div class="empty">
            مضامین لوڈ ہو رہے ہیں...
        </div>
    </div>

</div>

<script>

const REPO = "mutalaa92/mutalaa92.github.io";

function getCategory() {

    const params = new URLSearchParams(window.location.search);

    return params.get("name") || "";

}

function parseFrontMatter(text) {

    const match = text.match(/^---\s*([\s\S]*?)\s*---\s*([\s\S]*)$/);

    if (!match) {

        return {
            data: {},
            body: text
        };

    }

    const front = match[1];

    const body = match[2];

    const data = {};

    front.split("\n").forEach(line => {

        const index = line.indexOf(":");

        if (index === -1) return;

        const key = line.substring(0, index).trim();

        let value = line.substring(index + 1).trim();

        value = value.replace(/^["']|["']$/g, "");

        data[key] = value;

    });

    return {
        data,
        body
    };

}

function slugify(text) {

    return text
        .toLowerCase()
        .replace(/\.md$/, "")
        .replace(/^\d{4}-\d{2}-\d{2}-/, "")
        .replace(/[^\w\u0600-\u06ff\s-]/g, "")
        .trim()
        .replace(/\s+/g, "-");

}

async function loadCategory() {

    const category = getCategory();

    const title = document.getElementById("categoryTitle");

    const postsBox = document.getElementById("posts");

    title.textContent = category || "تمام مضامین";

    document.title =
        (category || "تمام مضامین") + " — مطالعہ";

    try {

        const response = await fetch(
            `https://api.github.com/repos/${REPO}/contents/_posts`
        );

        if (!response.ok) {
            throw new Error("Posts not found");
        }

        const files = await response.json();

        const markdownFiles =
            files.filter(file => file.name.endsWith(".md"));

        const posts = [];

        for (const file of markdownFiles) {

            try {

                const rawUrl =
                    `https://raw.githubusercontent.com/${REPO}/main/_posts/${encodeURIComponent(file.name)}`;

                const response = await fetch(rawUrl);

                const markdown = await response.text();

                const parsed = parseFrontMatter(markdown);

                const postCategory =
                    parsed.data.category || "";

                if (
                    category &&
                    postCategory.trim() !== category.trim()
                ) {
                    continue;
                }

                posts.push({
                    file: file,
                    data: parsed.data
                });

            } catch (error) {

                console.log("Post skipped:", file.name);

            }

        }

        posts.sort((a, b) => {

            const dateA =
                new Date(a.data.date || 0);

            const dateB =
                new Date(b.data.date || 0);

            return dateB - dateA;

        });

        if (!posts.length) {

            postsBox.innerHTML = `
                <div class="empty">
                    <h2>ابھی کوئی مضمون موجود نہیں</h2>
                    <p>
                        اس موضوع کے تحت ابھی کوئی مضمون شائع نہیں کیا گیا۔
                    </p>
                </div>
            `;

            return;

        }

        postsBox.innerHTML = posts.map(post => {

            const title =
                post.data.title || "بغیر عنوان";

            const date =
                post.data.date || "";

            const categoryName =
                post.data.category || "";

            const slug =
                slugify(post.file.name);

            return `

                <article class="post">

                    <h2>
                        <a href="article.html?slug=${encodeURIComponent(slug)}">
                            ${title}
                        </a>
                    </h2>

                    <div class="meta">

                        ${categoryName}

                        ${date ? " | " + date : ""}

                    </div>

                    <a
                        class="read"
                        href="article.html?slug=${encodeURIComponent(slug)}"
                    >
                        مکمل مضمون پڑھیں
                    </a>

                </article>

            `;

        }).join("");

    } catch (error) {

        console.error(error);

        postsBox.innerHTML = `
            <div class="empty">
                <h2>مضامین لوڈ نہیں ہو سکے</h2>
                <p>
                    براہ کرم کچھ دیر بعد دوبارہ کوشش کریں۔
                </p>
            </div>
        `;

    }

}

loadCategory();

</script>

</body>
</html>
