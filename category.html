<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موضوعات — مطالعہ</title>
<link rel="stylesheet" href="style.css">
<style>
body{font-family:"Noto Nastaliq Urdu",serif;background:#f7f5ef;color:#243331;margin:0}.container{max-width:1000px;margin:auto;padding:25px 18px}header{background:#123c32;color:#fff;text-align:center;padding:25px}header h1{margin:0;font-size:32px}header a{color:#fff;text-decoration:none}.category-title{text-align:center;color:#123c32;margin:35px 0}.posts{display:grid;grid-template-columns:1fr;gap:18px}.post{background:#fff;border:1px solid #e3e4de;border-radius:15px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,.05)}.post h2{margin:0 0 8px}.post h2 a{color:#123c32;text-decoration:none}.meta{color:#8a6a29;font-size:14px}.read{display:inline-block;margin-top:12px;color:#123c32;text-decoration:none;font-weight:bold}.empty{text-align:center;background:#fff;border-radius:15px;padding:40px;border:1px solid #e3e4de}
</style>
</head>
<body>
<header><h1><a href="index.html">📚 مطالعہ</a></h1><div>علم، تحقیق اور اسلامی آثار</div></header>
<div class="container">
<h1 class="category-title" id="categoryTitle">مضامین</h1>
<div class="posts" id="posts"><div class="empty">مضامین لوڈ ہو رہے ہیں...</div></div>
</div>
<script>
const REPO="mutalaa92/mutalaa92.github.io";
const CATEGORY_NAMES={
  tawheed:"عقیدۂ توحید",history:"تاریخِ اسلام",sahaba:"مشاجراتِ صحابہ",sects:"فرق و مذاہب",hadith:"حدیث و آثار",books:"کتبِ اسلامیہ",seerah:"سیرت النبی ﷺ",scholars:"سیرتِ صحابہ و تابعین",current:"حالاتِ حاضرہ"
};
function getCategory(){return new URLSearchParams(location.search).get("cat")||"";}
function parseFrontMatter(text){const match=text.match(/^---\s*([\s\S]*?)\s*---\s*([\s\S]*)$/);if(!match)return{data:{},body:text};const data={};match[1].split("\n").forEach(line=>{const i=line.indexOf(":");if(i<0)return;const key=line.slice(0,i).trim();let value=line.slice(i+1).trim();value=value.replace(/^['"]|['"]$/g,"");data[key]=value});return{data,body:match[2]};}
function escapeHtml(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
async function loadCategory(){const key=getCategory();const category=CATEGORY_NAMES[key]||"";const title=document.getElementById("categoryTitle");const box=document.getElementById("posts");title.textContent=category||"تمام مضامین";document.title=(category||"تمام مضامین")+" — مطالعہ";try{const r=await fetch(`https://api.github.com/repos/${REPO}/contents/_posts`);if(!r.ok){if(r.status===404){box.innerHTML='<div class="empty"><h2>ابھی کوئی مضمون موجود نہیں</h2><p>پہلا مضمون شائع ہونے کے بعد یہاں ظاہر ہوگا۔</p></div>';return}throw Error("Posts not found")};const files=await r.json();const posts=[];for(const file of files.filter(f=>f.name.endsWith(".md"))){try{const raw=await fetch(`https://raw.githubusercontent.com/${REPO}/main/_posts/${encodeURIComponent(file.name)}`);if(!raw.ok)continue;const parsed=parseFrontMatter(await raw.text());if(category&&parsed.data.category.trim()!==category.trim())continue;posts.push({file,data:parsed.data})}catch(e){console.log("Post skipped",file.name)}}posts.sort((a,b)=>new Date(b.data.date||0)-new Date(a.data.date||0));if(!posts.length){box.innerHTML='<div class="empty"><h2>ابھی کوئی مضمون موجود نہیں</h2><p>اس موضوع کے تحت ابھی کوئی مضمون شائع نہیں کیا گیا۔</p></div>';return}box.innerHTML=posts.map(p=>{const title=escapeHtml(p.data.title||"بغیر عنوان");const date=escapeHtml(p.data.date||"");const cat=escapeHtml(p.data.category||"");return `<article class="post"><h2><a href="article.html?post=${encodeURIComponent(p.file.name)}">${title}</a></h2><div class="meta">${cat}${date?" | "+date:""}</div><a class="read" href="article.html?post=${encodeURIComponent(p.file.name)}">مکمل مضمون پڑھیں ←</a></article>`}).join("")}catch(e){console.error(e);box.innerHTML='<div class="empty"><h2>مضامین لوڈ نہیں ہو سکے</h2><p>براہ کرم کچھ دیر بعد دوبارہ کوشش کریں۔</p></div>'}}
loadCategory();
</script>
</body>
</html>
